<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>驾驶舱</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="wallpaper-layer" class="wallpaper-layer" aria-hidden="true"></div>
  <div id="scrim-layer" class="scrim-layer" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="topbar glass-surface">
      <div class="topbar-left">
        <img src="/logo.svg" alt="驾驶舱" class="brand-logo" />
        <select id="select-project" class="glass-select top-project-select" aria-label="切换项目"></select>
        <button id="btn-follow-latest" class="toggle-chip active" type="button">
          <span class="status-dot"></span>
          <span>跟随</span>
        </button>
      </div>
      <div class="topbar-right">
        <button id="btn-page-toggle" class="ghost-btn page-switch-btn" type="button">外观美化</button>
        <button id="btn-refresh" class="icon-pill" title="刷新">↻</button>
      </div>
    </header>

    <main class="main-scroll">
      <!-- ==================== PAGE 1: COCKPIT ==================== -->
      <section id="page-cockpit" class="page-view active">
        <div class="glass-card session-strip">
          <select id="select-conversation" class="glass-select" aria-label="切换会话"></select>
          <span id="active-status-pill" class="badge-pill">就绪</span>
          <button id="btn-jump-conv" class="ghost-btn compact-btn" type="button">跳转</button>
        </div>

        <!-- WINDOW 1: Project & Session Stats -->
        <div class="glass-card">
          <div class="card-header wrap-header">
            <div>
              <h2 class="card-title">项目与会话统计</h2>
              <div class="usage-totals tabular">
                <strong id="stats-total-tokens">0</strong>
                <span class="cost-pill" id="stats-total-cost">≈ $0.00</span>
                <span class="cache-pill" id="stats-cache-rate">缓存 0%</span>
              </div>
            </div>
            <div class="stats-controls">
              <div class="seg-group" id="stats-scope-group">
                <button class="seg-btn active" data-scope="project">当前项目</button>
                <button class="seg-btn" data-scope="session">当前会话</button>
                <button class="seg-btn" data-scope="all">全部项目</button>
              </div>
              <div class="seg-group" id="stats-range-group">
                <button class="seg-btn active" data-range="today">今天</button>
                <button class="seg-btn" data-range="7d">近7天</button>
                <button class="seg-btn" data-range="30d">近30天</button>
                <button class="seg-btn" data-range="all">全部</button>
              </div>
            </div>
          </div>

          <div class="stats-meta-row" id="stats-source-row">
            <div id="source-split-strip" class="source-split-strip tabular">
              <span>AGY GUI <strong id="src-gui">0</strong></span>
              <span>AGY CLI <strong id="src-agycli">0</strong></span>
              <span>Codex <strong id="src-codex">0</strong></span>
            </div>
            <div class="seg-group" id="stats-source-group">
              <button class="seg-btn active" data-source="all">全部</button>
              <button class="seg-btn" data-source="gui">GUI</button>
              <button class="seg-btn" data-source="agy-cli">AGY CLI</button>
              <button class="seg-btn" data-source="codex-cli">Codex</button>
            </div>
          </div>

          <div class="summary-strip tabular">
            <span><i class="dot tertiary"></i>缓存命中 <strong id="sum-cache">0</strong></span>
            <span><i class="dot accent"></i>未命中 <strong id="sum-uncached">0</strong></span>
            <span><i class="dot secondary"></i>输出 <strong id="sum-output">0</strong></span>
          </div>

          <div id="stats-ratio-bar" class="ratio-bar"></div>
          <div id="stats-models-list" class="models-list"></div>
          <div id="projects-switch-strip" class="projects-mini-grid"></div>
        </div>

        <!-- WINDOW 2: Quota Monitor -->
        <div class="glass-card">
          <div class="card-header">
            <h2 class="card-title">额度监控</h2>
            <button id="btn-quota-anchor" class="ghost-btn compact-btn" type="button">校准</button>
          </div>

          <div id="quota-anchor-editor" class="anchor-editor" hidden>
            <div class="anchor-grid">
              <label><span>Gemini 周剩余(%)</span><input id="inp-g7d-pct" type="number" min="0" max="100" placeholder="68" class="glass-input" /></label>
              <label><span>Gemini 周刷新</span><input id="inp-g7d-reset" type="text" placeholder="6d 4h" class="glass-input" /></label>
              <label><span>Gemini 5h剩余(%)</span><input id="inp-g5h-pct" type="number" min="0" max="100" placeholder="84" class="glass-input" /></label>
              <label><span>Gemini 5h刷新</span><input id="inp-g5h-reset" type="text" placeholder="4h 15m" class="glass-input" /></label>
              <label><span>Claude 周剩余(%)</span><input id="inp-c7d-pct" type="number" min="0" max="100" placeholder="24" class="glass-input" /></label>
              <label><span>Claude 周刷新</span><input id="inp-c7d-reset" type="text" placeholder="6d 4h" class="glass-input" /></label>
              <label><span>Claude 5h剩余(%)</span><input id="inp-c5h-pct" type="number" min="0" max="100" placeholder="100" class="glass-input" /></label>
              <label><span>Claude 5h刷新</span><input id="inp-c5h-reset" type="text" placeholder="5h" class="glass-input" /></label>
            </div>
            <div class="anchor-actions">
              <button id="btn-clear-anchor" class="ghost-btn compact-btn" type="button">清空</button>
              <button id="btn-save-anchor" class="primary-btn compact-btn" type="button">保存</button>
            </div>
          </div>

          <div id="quota-grid" class="quota-grid"></div>
        </div>

        <!-- WINDOW 3: Real-Time Context Window -->
        <div class="glass-card">
          <div class="card-header">
            <h2 class="card-title">实时上下文窗口</h2>
            <div class="seg-group" id="window-limit-group">
              <button class="seg-btn" data-limit="200000">200k</button>
              <button class="seg-btn active" data-limit="512000">512k</button>
              <button class="seg-btn" data-limit="1000000">1M</button>
            </div>
          </div>

          <div class="context-hero-body">
            <div class="ring-wrap">
              <svg class="context-ring" viewBox="0 0 120 120">
                <defs>
                  <linearGradient id="prismRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="var(--prism-accent)" />
                    <stop offset="55%" stop-color="var(--prism-secondary)" />
                    <stop offset="100%" stop-color="var(--prism-tertiary)" />
                  </linearGradient>
                  <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2.4" result="blur" />
                    <feMerge>
                      <feMergeNode in="blur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>
                <circle class="ring-track" cx="60" cy="60" r="48" />
                <circle id="ring-progress" class="ring-fill" cx="60" cy="60" r="48" filter="url(#ringGlow)" />
              </svg>
              <div class="ring-center">
                <span id="ring-percent" class="ring-percent tabular">0%</span>
                <span class="ring-label">已占用</span>
              </div>
            </div>

            <div class="context-breakdown">
              <div class="token-headline tabular">
                <strong id="ctx-used">0</strong>
                <span class="muted"> / <span id="ctx-limit">512,000</span></span>
              </div>
              <div class="breakdown-list" id="breakdown-list"></div>
            </div>
          </div>

          <div class="sub-divider"></div>
          <div class="ctx-live-footer">
            <div class="ctx-live-item">
              <span class="metric-label">模型</span>
              <span id="ctx-model-badge" class="model-chip">—</span>
            </div>
            <div class="ctx-live-item">
              <span class="metric-label">思考强度</span>
              <span id="ctx-effort-badge" class="effort-chip">—</span>
            </div>
            <div class="ctx-live-item">
              <span class="metric-label">速率</span>
              <span class="speed-inline tabular"><strong id="metric-speed">—</strong> <span class="muted">tok/s</span></span>
            </div>
            <div class="sparkline-mini">
              <svg id="speed-sparkline" class="sparkline-svg" viewBox="0 0 120 30" preserveAspectRatio="none"></svg>
            </div>
          </div>
        </div>

        <!-- WINDOW 4: Active CLI & Subagent Monitor -->
        <div class="glass-card">
          <div class="card-header">
            <div class="title-with-badge">
              <h2 class="card-title">活动 CLI 与子智能体</h2>
              <span id="active-agents-badge" class="badge-pill">0 活动中</span>
            </div>
            <button id="btn-toggle-recent-agents" class="ghost-btn compact-btn" type="button">近期 1h (0)</button>
          </div>
          <div id="agents-list" class="agents-list"></div>
        </div>
      </section>

      <!-- ==================== PAGE 2: APPEARANCE STUDIO ==================== -->
      <section id="page-studio" class="page-view">
        <div class="glass-card companion-card">
          <div class="card-header">
            <div class="title-with-badge">
              <h2 class="card-title">整窗氛围伴侣</h2>
              <span id="companion-status-badge" class="badge-pill">准备就绪</span>
            </div>
            <button id="btn-toggle-companion" class="primary-btn" type="button">开启整窗氛围</button>
          </div>

          <div class="sliders-grid">
            <label class="slider-item">
              <div class="slider-head">
                <span>整窗壁纸亮度</span>
                <strong id="val-comp-opacity" class="tabular">62%</strong>
              </div>
              <input id="range-comp-opacity" type="range" min="15" max="90" value="62" />
            </label>
            <label class="slider-item">
              <div class="slider-head">
                <span>边缘柔光衰减</span>
                <strong id="val-comp-vignette" class="tabular">18%</strong>
              </div>
              <input id="range-comp-vignette" type="range" min="0" max="75" value="18" />
            </label>
            <label class="slider-item">
              <div class="slider-head">
                <span>整窗柔焦</span>
                <strong id="val-comp-blur" class="tabular">0px</strong>
              </div>
              <input id="range-comp-blur" type="range" min="0" max="20" value="0" />
            </label>
            <div class="checkbox-stack">
              <label class="checkbox-item">
                <input id="chk-comp-seamless" type="checkbox" checked />
                <span>左右窗口壁纸无缝贯穿</span>
              </label>
              <label class="checkbox-item">
                <input id="chk-comp-rim" type="checkbox" checked />
                <span>液态玻璃窗框高光</span>
              </label>
              <label class="checkbox-item">
                <input id="chk-comp-frontmost" type="checkbox" checked />
                <span>切到其他应用自动隐藏</span>
              </label>
            </div>
          </div>

          <div class="fit-row">
            <span class="fit-label">混合模式</span>
            <div class="seg-group" id="comp-blend-group">
              <button class="seg-btn active" data-blend="screen">星光滤色</button>
              <button class="seg-btn" data-blend="soft">柔雾透叠</button>
            </div>
          </div>
          <p id="companion-error" class="error-text" hidden></p>
        </div>

        <div class="glass-card">
          <div class="card-header wrap-header">
            <div class="title-with-badge">
              <h2 class="card-title">壁纸画廊</h2>
              <span id="active-wallpaper-name" class="badge-pill">星海夜行电车</span>
            </div>
            <div class="header-actions">
              <button id="btn-random-wp" class="ghost-btn" type="button">随机</button>
              <button id="btn-upload-wp" class="ghost-btn" type="button">上传</button>
              <button id="btn-clear-wp" class="ghost-btn" type="button">清除</button>
              <input id="file-wallpaper" type="file" accept="image/png,image/jpeg,image/webp" hidden />
            </div>
          </div>

          <div id="wallpaper-grid" class="wallpaper-grid"></div>

          <div class="sliders-grid">
            <label class="slider-item">
              <div class="slider-head">
                <span>壁纸透明度</span>
                <strong id="val-wp-opacity" class="tabular">100%</strong>
              </div>
              <input id="range-wp-opacity" type="range" min="0" max="100" value="100" />
            </label>
            <label class="slider-item">
              <div class="slider-head">
                <span>磨砂模糊</span>
                <strong id="val-wp-blur" class="tabular">4px</strong>
              </div>
              <input id="range-wp-blur" type="range" min="0" max="24" value="4" />
            </label>
            <label class="slider-item">
              <div class="slider-head">
                <span>暗度遮罩</span>
                <strong id="val-wp-darkness" class="tabular">6%</strong>
              </div>
              <input id="range-wp-darkness" type="range" min="0" max="80" value="6" />
            </label>
            <label class="slider-item">
              <div class="slider-head">
                <span>卡片圆角</span>
                <strong id="val-wp-radius" class="tabular">12px</strong>
              </div>
              <input id="range-wp-radius" type="range" min="4" max="22" value="12" />
            </label>
          </div>

          <div class="fit-row">
            <span class="fit-label">壁纸适配</span>
            <div class="seg-group" id="wp-fit-group">
              <button class="seg-btn active" data-fit="cover">铺满裁剪</button>
              <button class="seg-btn" data-fit="contain">完整居中</button>
            </div>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-header wrap-header">
            <h2 class="card-title">液态玻璃色调</h2>
            <div class="header-actions">
              <button id="btn-follow-host" class="toggle-chip" type="button">
                <span class="status-dot"></span>
                <span>跟随宿主明暗</span>
              </button>
              <button id="btn-reset-colors" class="ghost-btn" type="button">还原默认</button>
            </div>
          </div>

          <div id="preset-pills" class="preset-pills"></div>

          <div class="save-preset-row">
            <input id="input-preset-name" type="text" class="glass-input" placeholder="命名并保存当前方案..." maxlength="24" />
            <button id="btn-save-preset" class="primary-btn" type="button">保存</button>
          </div>

          <div id="color-pickers" class="color-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
